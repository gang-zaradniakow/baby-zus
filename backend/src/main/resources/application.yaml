spring:
  application:
    name: zus-baby-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zusbaby}
    username: ${DB_USERNAME:zusbaby}
    password: ${DB_PASSWORD:zusbaby}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  jackson:
    # absent optional fields are left out of JSON instead of being sent as null (see openapi.yaml conventions)
    default-property-inclusion: non_null

server:
  # Behind the reverse proxy the backend is mounted under a path prefix (TEST: /api/baby-zus-backend). The proxy
  # strips the prefix and sends X-Forwarded-Prefix/-Host/-Proto; honouring them lets generated links (Swagger UI
  # spec URL, redirects) include the prefix. Without the headers nothing changes.
  forward-headers-strategy: framework

zusbaby:
  web:
    # comma-separated frontend origins allowed by CORS; default = prototype served by server.py
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8765,http://127.0.0.1:8765}
  identity:
    # HS256 key of the access tokens (at least 32 bytes). The default is for local runs only: set JWT_SECRET on
    # every shared environment, otherwise anybody who reads this file can sign tokens.
    jwt-secret: ${JWT_SECRET:local-development-only-secret-do-not-use-elsewhere}
    issuer: zus-baby-backend
    code-ttl: 2m
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # comma-separated frontend addresses a login may return to (exact match)
    allowed-redirect-uris: ${LOGIN_REDIRECT_URIS:http://localhost:8765/,http://127.0.0.1:8765/}

# API contract is the static src/main/resources/openapi/openapi.yaml, not generated from code.
# Swagger UI needs springdoc's api-docs endpoint to be on, so it stays enabled but documents no paths
# (/v3/api-docs is intentionally empty); the UI shows only the spec served at /api/v1/openapi.yaml.
# The spec lives under the API prefix: on the TEST environment /openapi.yaml was answered by the frontend.
springdoc:
  api-docs:
    enabled: true
  paths-to-match: /__generated-docs-disabled__
  swagger-ui:
    url: /api/v1/openapi.yaml

info:
  app:
    version: ${APP_VERSION:dev}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
