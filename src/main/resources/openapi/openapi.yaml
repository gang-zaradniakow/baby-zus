openapi: 3.0.3
info:
  title: mZUS dla Rodzica — backend API
  version: 0.1.0
  description: |
    Backend of the "mZUS dla Rodzica" prototype (HackNation 2026). Contract-first: every endpoint is described here
    before it is implemented; Spring interfaces are generated from this file.

    Conventions:
    - all paths start with `/api/v1`,
    - dates are ISO-8601 (`2026-11-21`), moments are ISO-8601 with offset,
    - money is a decimal string with two places (`"4147.10"`),
    - optional fields without a value are omitted, never sent as `null`,
    - every error is an RFC 9457 problem with `code` (stable, for the frontend) and `gentleMessage`
      (Polish text that can be shown to the user as is).
servers:
  - url: /
tags:
  - name: System
    description: Technical endpoints.
  - name: LegalParameters
    description: Legal parameters (rates, amounts, leave dimensions) used by all calculations.
  - name: Deadlines
    description: Statutory deadlines counted with the Polish calendar of public holidays.
  - name: Calculations
    description: Benefit calculations (insurance titles, benefit base, sickness and maternity benefits).

paths:
  /api/v1/ping:
    get:
      tags: [System]
      operationId: ping
      summary: Check that the API is up
      description: Returns a fixed status and the current server time (from DateTimeGenerator).
      responses:
        '200':
          description: API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/legal-parameters:
    get:
      tags: [LegalParameters]
      operationId: getLegalParameters
      summary: Legal parameters in force today
      description: |
        Returns the newest parameter set whose `validFrom` is not later than today. The same values are used by
        every calculation in the backend. Parameters are defined in code; a new legal state means a new version.
      responses:
        '200':
          description: Parameters in force.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalParametersResponse'
        '404':
          description: No parameter set is in force yet (`code` = `legal-parameters-not-found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/deadlines:
    get:
      tags: [Deadlines]
      operationId: calculateDeadline
      summary: Calculate a statutory deadline
      description: |
        Counts a deadline from an event using the Polish calendar (Saturdays, Sundays, public holidays incl.
        Christmas Eve since 2025). Give exactly one of `days` or `months`; `BEFORE` accepts only `days`.
        - `AFTER` + `days`: "within X days of the event", e.g. 21 days after birth for the 81.5% variant.
        - `AFTER` + `months`: "within X months of the event", e.g. 3 months.
        - `BEFORE` + `days`: "at least X days before the event", e.g. 21 days before parental leave starts.
      parameters:
        - name: event
          in: query
          required: true
          description: Day of the event (birth, start of leave...).
          schema:
            type: string
            format: date
          example: '2026-11-21'
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/DeadlineType'
        - name: days
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 3660
          example: 21
        - name: months
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 120
      responses:
        '200':
          description: Calculated deadline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deadline'
        '400':
          description: Missing or contradictory parameters (`code` = `validation-failed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/calculations/insurance:
    post:
      tags: [Calculations]
      operationId: resolveInsurance
      summary: Resolve concurrent insurance titles
      description: |
        Decides which insurance titles give a sickness/maternity benefit and with what base (Poradnik ZUS 2026,
        s. 9–14): full-time employment at minimum wage excludes the firm and the mandate contract, a student on a
        mandate contract is not insured, startup relief means no social insurance, contribution debt of the firm above
        1% of the minimum wage blocks the benefit. Every decision is explained in `checks`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsuranceTitlesRequest'
      responses:
        '200':
          description: Titles that give a benefit and the explanation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuranceResolution'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/calculations/benefit-base:
    post:
      tags: [Calculations]
      operationId: calculateBenefitBase
      summary: Benefit base from the payer's certificate (Z-3 / Z-3a)
      description: |
        Average gross pay of up to 12 months minus employee contributions. Months with less than half of the working
        time are skipped. Full-time employment gets at least the minimum base; voluntary sickness insurance is capped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenefitBaseRequest'
      responses:
        '200':
          description: Calculated benefit base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitBase'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/calculations/leave-dimensions:
    post:
      tags: [Calculations]
      operationId: calculateLeaveDimensions
      summary: Length of maternity, parental and supplementary leave
      description: |
        Maternity leave by the number of children (20–37 weeks) and parental leave (41/43 weeks, 65/67 with the
        "Za życiem" certificate). For a child taken in (`adoption`) the age limit applies (14 years for adoption,
        7 or 10 for a foster family) with at least 9 weeks of leave. For a premature or hospitalised newborn
        (`preterm`) the supplementary maternity leave is added (up to 15 or 8 weeks). `adoption` and `preterm`
        exclude each other.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveDimensionsRequest'
      responses:
        '200':
          description: Calculated leave lengths.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveDimensions'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'

components:
  responses:
    ValidationProblem:
      description: Invalid request (`code` = `validation-failed` or `bad-request`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Problem:
      description: Error described as an RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    PingResponse:
      type: object
      required: [status, time]
      properties:
        status:
          type: string
          enum: [UP]
        time:
          type: string
          format: date-time
          description: Current server time.

    LegalParametersResponse:
      type: object
      required: [version, validFrom, description, parameters]
      properties:
        version:
          type: integer
          format: int32
          description: Version of the parameter set; every change creates a new one.
          example: 1
        validFrom:
          type: string
          format: date
          description: Day from which this version is in force.
        description:
          type: string
          description: Legal basis of the values (acts, ZUS guide).
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/LegalParameter'

    LegalParameter:
      type: object
      description: |
        One parameter. Single-valued kinds use `value`; `WEEKS_BY_CHILDREN` uses `values` (for 1, 2, 3, 4 and 5 or
        more children). Values are plain numbers: amounts in PLN, rates as fractions (0.815 = 81.5%).
      required: [key, kind, label]
      properties:
        key:
          type: string
          example: MINIMUM_WAGE
        kind:
          $ref: '#/components/schemas/LegalParameterKind'
        label:
          type: string
          description: Polish label for the admin panel.
          example: Płaca minimalna
        value:
          type: number
          example: 4806
        values:
          type: array
          items:
            type: number
          example: [20, 31, 33, 35, 37]

    LegalParameterKind:
      type: string
      enum: [AMOUNT, RATE, WEEKS, DAYS, MONTHS, YEARS, WEEKS_BY_CHILDREN]

    InsuranceTitle:
      type: string
      description: Insurance title with sickness insurance in ZUS.
      enum: [EMPLOYMENT, MANDATE_CONTRACT, SELF_EMPLOYMENT]

    InsuranceTitlesRequest:
      type: object
      description: Titles of one person; leave out a title the person does not have.
      properties:
        employment:
          $ref: '#/components/schemas/EmploymentTitle'
        mandateContract:
          $ref: '#/components/schemas/MandateContractTitle'
        selfEmployment:
          $ref: '#/components/schemas/SelfEmploymentTitle'
        agriculturalInsurance:
          type: boolean
          default: false
          description: Insured as a farmer in KRUS.

    EmploymentTitle:
      type: object
      required: [base]
      properties:
        base:
          $ref: '#/components/schemas/Money'
        atLeastMinimumWage:
          type: boolean
          default: true
          description: Pay at least the minimum wage (excludes sickness insurance from other titles).

    MandateContractTitle:
      type: object
      required: [base, voluntarySickness]
      properties:
        base:
          $ref: '#/components/schemas/Money'
        voluntarySickness:
          type: boolean
          description: Joined voluntary sickness insurance.
        student:
          type: boolean
          default: false
          description: Student or pupil under 26 (not insured on a mandate contract).

    SelfEmploymentTitle:
      type: object
      required: [base, voluntarySickness]
      properties:
        base:
          $ref: '#/components/schemas/Money'
        voluntarySickness:
          type: boolean
        startupRelief:
          type: boolean
          default: false
          description: First 6 months on startup relief (no social insurance).
        debt:
          $ref: '#/components/schemas/Money'

    InsuranceResolution:
      type: object
      required: [base, parts, checks, agriculturalInsurance, blockingDebt]
      properties:
        mainTitle:
          $ref: '#/components/schemas/InsuranceTitle'
        base:
          $ref: '#/components/schemas/Money'
        parts:
          type: array
          description: Titles that give a benefit, each with its own base.
          items:
            $ref: '#/components/schemas/TitleBase'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/Check'
        agriculturalInsurance:
          type: boolean
        blockingDebt:
          $ref: '#/components/schemas/Money'

    TitleBase:
      type: object
      required: [title, base]
      properties:
        title:
          $ref: '#/components/schemas/InsuranceTitle'
        base:
          $ref: '#/components/schemas/Money'

    BenefitBaseRequest:
      type: object
      required: [months, title]
      properties:
        months:
          type: array
          minItems: 1
          maxItems: 12
          description: Gross pay of the last (up to) 12 months from Z-3 / Z-3a.
          items:
            $ref: '#/components/schemas/MonthlyPay'
        title:
          $ref: '#/components/schemas/InsuranceTitle'
        fullTime:
          type: boolean
          default: true

    MonthlyPay:
      type: object
      required: [amount]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        skip:
          type: boolean
          default: false
          description: Less than half of the working time in the month — left out of the average.

    BenefitBase:
      type: object
      required: [base, average, monthsCounted, note]
      properties:
        base:
          $ref: '#/components/schemas/Money'
        average:
          $ref: '#/components/schemas/Money'
        monthsCounted:
          type: integer
          format: int32
        note:
          type: string
          description: Polish explanation of how the base was calculated.

    LeaveDimensionsRequest:
      type: object
      required: [children]
      properties:
        children:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          description: Children born (or taken in) at once.
        zaZyciem:
          type: boolean
          default: false
          description: The child has the "Za życiem" certificate.
        adoption:
          $ref: '#/components/schemas/AdoptionDetails'
        preterm:
          $ref: '#/components/schemas/PretermDetails'

    AdoptionDetails:
      type: object
      required: [type, childAge]
      properties:
        type:
          type: string
          enum: [ADOPTION, FOSTER_FAMILY]
          description: Adoption (court proceedings started) or a non-professional foster family.
        childAge:
          type: number
          minimum: 0
          maximum: 18
          description: Age of the child in years when taken in, e.g. 1.5.
        deferredSchool:
          type: boolean
          default: false
          description: Compulsory schooling deferred (foster family age limit 10 instead of 7 years).

    PretermDetails:
      type: object
      required: [gestationWeek, birthWeightGrams, hospitalDays]
      properties:
        gestationWeek:
          type: integer
          format: int32
          minimum: 20
          maximum: 44
        birthWeightGrams:
          type: integer
          format: int32
          minimum: 300
          maximum: 7000
        hospitalDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 365
          description: Days the child stayed in hospital (until the 8th / 15th week after birth).
        hospitalStartDay:
          type: integer
          format: int32
          minimum: 0
          maximum: 365
          default: 5
          description: Day after birth the stay started (matters for children born after the 37th week).

    LeaveDimensions:
      type: object
      required: [maternityWeeks, parentalWeeks]
      properties:
        maternityWeeks:
          type: integer
          format: int32
          description: Maternity leave (or leave on maternity terms for a child taken in).
        parentalWeeks:
          type: integer
          format: int32
        adoption:
          $ref: '#/components/schemas/AdoptionLeave'
        supplementary:
          $ref: '#/components/schemas/SupplementaryLeave'

    AdoptionLeave:
      type: object
      required: [ageLimit, note]
      properties:
        ageLimit:
          type: integer
          format: int32
        note:
          type: string

    SupplementaryLeave:
      type: object
      required: [weeks, limit, rule]
      properties:
        weeks:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        rule:
          type: string

    ProblemDetail:
      type: object
      description: RFC 9457 problem with the application-specific `code` and `gentleMessage`.
      required: [status, code, gentleMessage]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable error code, e.g. `validation-failed`.
          example: validation-failed
        gentleMessage:
          type: string
          description: Calm Polish explanation that can be shown to the user as is.
          example: Wygląda na to, że część danych jest niepełna lub niepoprawna. Sprawdź je i spróbuj jeszcze raz.
        errors:
          type: array
          description: Invalid fields (only for validation errors).
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    Money:
      type: string
      description: Amount in PLN with exactly two decimal places.
      pattern: '^-?\d+\.\d{2}$'
      example: '4147.10'

    Check:
      type: object
      description: One explained result of a rule shown next to a calculation.
      required: [level, message]
      properties:
        level:
          type: string
          enum: ['OK', 'INFO', 'NO']
        message:
          type: string
          description: Polish, user-facing.

    DeadlineType:
      type: string
      description: |
        `AFTER` = "within X days/months of an event" (a deadline ending on a day off moves to the next working day);
        `BEFORE` = "at least X days before an event" (counted backwards, never moved forward).
      enum: [AFTER, BEFORE]

    Deadline:
      type: object
      description: Statutory deadline with the legally valid day and the recommended day to act.
      required: [type, raw, legal, shifted, safe]
      properties:
        type:
          $ref: '#/components/schemas/DeadlineType'
        raw:
          type: string
          format: date
          description: Day counted from the event, before any shift.
        legal:
          type: string
          format: date
          description: Last legally valid day.
        shifted:
          type: boolean
          description: Whether the legal day was moved because the raw day was a day off.
        reason:
          type: string
          description: Why the raw day is a day off (holiday name, `sobota`, `niedziela`).
        safe:
          type: string
          format: date
          description: Recommended day to submit.
