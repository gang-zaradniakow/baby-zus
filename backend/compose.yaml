services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zusbaby
      POSTGRES_USER: zusbaby
      POSTGRES_PASSWORD: zusbaby
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zusbaby -d zusbaby"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
