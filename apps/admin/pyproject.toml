[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "zus-admin"
version = "0.1.0"
description = "Panel administracyjny tylko do odczytu: parametry, katalog, audyt, analityka"
requires-python = ">=3.14"
dependencies = [
  "zus-contracts",
  "zus-rules-engine",
  "fastapi>=0.165,<1",
  "uvicorn[standard]>=0.54,<1",
  "jinja2>=3.1,<4",
  "sqlalchemy[asyncio]>=2.1,<3",
  "asyncpg>=0.32,<1",
  "pydantic-settings>=2.16,<3",
]

[tool.setuptools.package-data]
admin = ["py.typed"]
