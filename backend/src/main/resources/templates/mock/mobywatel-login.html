<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mObywatel — logowanie (symulacja)</title>
  <style>
    :root { color-scheme: light dark; --brand: #0052a5; --line: #d5dbe3; --muted: #5b6472; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: Canvas; color: CanvasText; }
    main { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.3rem; margin: 8px 0 4px; }
    p.muted { color: var(--muted); margin: 0 0 16px; font-size: .9rem; }
    form { margin: 0 0 10px; }
    button { width: 100%; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px;
      background: transparent; color: inherit; font: inherit; cursor: pointer; }
    button:hover, button:focus-visible { border-color: var(--brand); outline: 2px solid var(--brand); }
    button b { display: block; }
    button small { color: var(--muted); }
    .new { border-style: dashed; }
  </style>
</head>
<body>
<main>
  <h1>Zaloguj się przez mObywatel</h1>
  <p class="muted">Symulacja logowania. Wszystkie osoby i dane są fikcyjne.</p>
  <form th:each="persona : ${personas}" method="post" th:action="@{/api/v1/mock/mobywatel/login}">
    <input type="hidden" name="persona" th:value="${persona.id}">
    <input type="hidden" name="redirect_uri" th:value="${redirectUri}">
    <input type="hidden" name="state" th:value="${state}">
    <button type="submit"><b th:text="${persona.label}">Persona</b><small th:text="${persona.description}">Opis</small></button>
  </form>
  <form method="post" th:action="@{/api/v1/mock/mobywatel/login}">
    <input type="hidden" name="persona" th:value="${newUser}">
    <input type="hidden" name="redirect_uri" th:value="${redirectUri}">
    <input type="hidden" name="state" th:value="${state}">
    <button type="submit" class="new"><b>Nowy użytkownik</b><small>Bez danych z eZUS, profil uzupełnisz w ankiecie.</small></button>
  </form>
</main>
</body>
</html>
