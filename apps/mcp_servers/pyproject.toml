[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "zus-mcp-servers"
version = "0.1.0"
description = "Serwery MCP (mocki danych ZUS, kalkulator, dokumenty, wiedza, profil)"
requires-python = ">=3.14"
dependencies = [
  "zus-contracts",
  "zus-rules-engine",
  "zus-profile-source",
  "mcp>=2.3,<3",
  "pydantic-settings>=2.16,<3",
]

[tool.setuptools.package-data]
mcp_servers = ["py.typed"]
