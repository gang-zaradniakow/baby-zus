[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "zus-assistant"
version = "0.1.0"
description = "Poziom 2: orkiestrator LLM (wymienny model), walidator liczb, RAG, klient MCP"
requires-python = ">=3.14"
dependencies = [
  "zus-contracts",
  "zus-rules-engine",  # katalog intencji, wyszukiwarka, kalkulator dla orkiestratora
  "openai>=3.57,<4",
  "httpx>=0.28,<1",
  "mcp>=2.3,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy[asyncio]>=2.1,<3",  # indeks pgvector bazy wiedzy (ZUS-35)
  "asyncpg>=0.32,<1",
]

[tool.setuptools.package-data]
assistant = ["py.typed"]
